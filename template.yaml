AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Anti-Proxy Attendance System – DA3

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 128
    Environment:
      Variables:
        SESSIONS_TABLE: !Ref SessionsTable
        ATTENDANCE_TABLE: !Ref AttendanceTable
        TOKEN_SECRET: !Ref TokenSecret
        REPORT_TOPIC_ARN: !Ref ReportTopic

Parameters:
  TokenSecret:
    Type: String
    NoEcho: true
    Default: "replace-with-strong-secret"

# ─────────────────────────────────────────
Resources:
  # ── DynamoDB ──────────────────────────
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: attendance-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: session_id, AttributeType: S }
      KeySchema:
        - { AttributeName: session_id, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  AttendanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: attendance-records
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: session_id, AttributeType: S }
        - { AttributeName: student_id, AttributeType: S }
      KeySchema:
        - { AttributeName: session_id, KeyType: HASH }
        - { AttributeName: student_id, KeyType: RANGE }

  # ── Cognito ───────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: attendance-user-pool
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Schema:
        - { Name: name, AttributeDataType: String, Mutable: true }

  FacultyGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Faculty
      UserPoolId: !Ref UserPool

  StudentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Student
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: attendance-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ── SNS ───────────────────────────────
  ReportTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: attendance-reports

  # ── API Gateway ───────────────────────
  AttendanceApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn

  # ── Lambda Functions ──────────────────
  StartSessionFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: start_session.lambda_handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
      Events:
        Api:
          {
            Type: Api,
            Properties:
              { RestApiId: !Ref AttendanceApi, Path: /sessions, Method: post },
          }

  GenerateTokenFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: generate_token.lambda_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SessionsTable }
      Events:
        Api:
          {
            Type: Api,
            Properties:
              {
                RestApiId: !Ref AttendanceApi,
                Path: "/sessions/{session_id}/token",
                Method: get,
              },
          }

  MarkAttendanceFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: mark_attendance.lambda_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AttendanceTable }
      Events:
        Api:
          {
            Type: Api,
            Properties:
              {
                RestApiId: !Ref AttendanceApi,
                Path: /attendance,
                Method: post,
              },
          }

  CloseSessionFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: close_session.lambda_handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBReadPolicy: { TableName: !Ref AttendanceTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt ReportTopic.TopicName }
      Events:
        Api:
          {
            Type: Api,
            Properties:
              {
                RestApiId: !Ref AttendanceApi,
                Path: "/sessions/{session_id}/close",
                Method: post,
              },
          }

  ReportFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: report.lambda_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBReadPolicy: { TableName: !Ref AttendanceTable }
      Events:
        List:
          {
            Type: Api,
            Properties:
              { RestApiId: !Ref AttendanceApi, Path: /reports, Method: get },
          }
        Detail:
          {
            Type: Api,
            Properties:
              {
                RestApiId: !Ref AttendanceApi,
                Path: "/reports/{session_id}",
                Method: get,
              },
          }

  # ── EventBridge auto-close ─────────────
  AutoCloseFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: close_session.auto_close_handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBReadPolicy: { TableName: !Ref AttendanceTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt ReportTopic.TopicName }
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true

# ─────────────────────────────────────────
Outputs:
  ApiUrl:
    Value: !Sub "https://${AttendanceApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Description: Paste this into the frontend CONFIG
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ReportTopicArn:
    Value: !Ref ReportTopic
