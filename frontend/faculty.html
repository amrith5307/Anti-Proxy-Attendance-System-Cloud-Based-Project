<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faculty – Anti-Proxy Attendance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding:1.5rem}
  h2{color:#38bdf8;margin-bottom:1rem}
  .card{background:#1e293b;border-radius:12px;padding:1.5rem;margin-bottom:1.2rem}
  input,select{padding:.5rem .8rem;border-radius:8px;border:1px solid #334155;
               background:#0f172a;color:#e2e8f0;width:100%;margin-bottom:.8rem}
  button{padding:.6rem 1.2rem;border:none;border-radius:8px;cursor:pointer;font-weight:600}
  .btn-primary{background:#38bdf8;color:#0f172a}
  .btn-danger {background:#ef4444;color:#fff}
  #qr-box{display:none;text-align:center}
  #qr-box canvas,#qr-box img{margin:auto}
  #countdown{font-size:1.3rem;color:#f59e0b;margin:.8rem 0}
  #status-msg{color:#4ade80;margin-top:.5rem;font-size:.9rem}
  table{width:100%;border-collapse:collapse;margin-top:.8rem;font-size:.85rem}
  th{text-align:left;padding:.4rem .6rem;background:#0f172a;color:#94a3b8}
  td{padding:.4rem .6rem;border-top:1px solid #334155}
  .badge{padding:.2rem .6rem;border-radius:999px;font-size:.75rem;font-weight:700}
  .active{background:#166534;color:#4ade80}
  .closed{background:#3f1414;color:#f87171}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
</style>
</head>
<body>
<!-- FILL THESE IN AFTER sam deploy -->
<script>
const API  = "https://XXXXXXXX.execute-api.us-east-1.amazonaws.com/prod";
</script>

<header>
  <h2>👨‍🏫 Faculty Dashboard</h2>
  <div>
    <span id="user-name" style="color:#94a3b8;margin-right:1rem"></span>
    <button class="btn-danger" onclick="logout()">Logout</button>
  </div>
</header>

<div class="card">
  <h3 style="margin-bottom:1rem;color:#7dd3fc">Start New Session</h3>
  <input id="subject"  placeholder="Subject (e.g. CN Lab)">
  <input id="duration" type="number" placeholder="Duration (minutes)" value="60">
  <button class="btn-primary" onclick="startSession()">▶ Start Session</button>
  <div id="status-msg"></div>
</div>

<div class="card" id="qr-box">
  <h3 style="margin-bottom:.5rem;color:#7dd3fc">Live QR Code</h3>
  <p style="font-size:.8rem;color:#94a3b8">Refreshes every 30 seconds</p>
  <div id="countdown">⏱ --s</div>
  <div id="qrcode"></div>
  <br>
  <button class="btn-danger" onclick="closeSession()">⏹ Close Session</button>
</div>

<div class="card">
  <h3 style="margin-bottom:.8rem;color:#7dd3fc">Your Sessions</h3>
  <button class="btn-primary" onclick="loadReports()" style="margin-bottom:.8rem">🔄 Refresh</button>
  <table><thead><tr><th>Subject</th><th>Status</th><th>Date</th><th>Detail</th></tr></thead>
  <tbody id="sessions-body"></tbody></table>
</div>

<script>
const token   = () => sessionStorage.getItem("id_token");
let sessionId = null, qr = null, timer = null;

document.getElementById("user-name").textContent =
  sessionStorage.getItem("user_name") || "";

function logout(){
  sessionStorage.clear(); location.href="index.html";
}

function status(t,err=false){
  const el=document.getElementById("status-msg");
  el.style.color=err?"#f87171":"#4ade80"; el.textContent=t;
}

async function api(path, opts={}){
  const r = await fetch(API+path, {
    ...opts,
    headers:{ "Content-Type":"application/json",
              "Authorization": token(), ...(opts.headers||{}) }
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error||"Request failed");
  return d;
}

async function startSession(){
  const subject  = document.getElementById("subject").value.trim()||"General";
  const duration = document.getElementById("duration").value||60;
  try{
    const d = await api("/sessions",{
      method:"POST",
      body: JSON.stringify({subject, duration_minutes: duration})
    });
    sessionId = d.session_id;
    status("Session started! QR is live.");
    document.getElementById("qr-box").style.display="block";
    startQrLoop();
    loadReports();
  }catch(e){ status(e.message,true); }
}

async function fetchAndRenderQR(){
  if(!sessionId) return;
  try{
    const d = await api(`/sessions/${sessionId}/token`);
    const data = JSON.stringify({token: d.token, session_id: sessionId});
    document.getElementById("qrcode").innerHTML="";
    qr = new QRCode(document.getElementById("qrcode"),{
      text: data, width:240, height:240,
      colorDark:"#0f172a", colorLight:"#fff"
    });
    let left = d.expires_in;
    clearInterval(timer);
    timer = setInterval(()=>{
      left--;
      document.getElementById("countdown").textContent=`⏱ ${left}s`;
      if(left<=0){ clearInterval(timer); fetchAndRenderQR(); }
    },1000);
  }catch(e){ status(e.message,true); }
}

function startQrLoop(){ fetchAndRenderQR(); }

async function closeSession(){
  if(!sessionId||!confirm("Close this session?")) return;
  try{
    const d = await api(`/sessions/${sessionId}/close`,{method:"POST"});
    status(`Closed. Present: ${d.present_count}`);
    document.getElementById("qr-box").style.display="none";
    clearInterval(timer);
    sessionId=null;
    loadReports();
  }catch(e){ status(e.message,true); }
}

async function loadReports(){
  try{
    const d = await api("/reports");
    const sessions = d.sessions||[];
    const body = document.getElementById("sessions-body");
    body.innerHTML = sessions.map(s=>`
      <tr>
        <td>${s.subject}</td>
        <td><span class="badge ${s.status==='ACTIVE'?'active':'closed'}">${s.status}</span></td>
        <td>${new Date(s.created_at*1000).toLocaleString()}</td>
        <td><button class="btn-primary" style="font-size:.75rem;padding:.2rem .6rem"
            onclick="viewDetail('${s.session_id}')">View</button></td>
      </tr>`).join("");
  }catch(e){ console.error(e); }
}

async function viewDetail(sid){
  try{
    const d = await api(`/reports/${sid}`);
    const rows = d.attendance||[];
    alert(rows.length===0
      ? "No attendance yet."
      : rows.map(r=>`${r.student_name} – ${new Date(r.marked_at*1000).toLocaleTimeString()}`).join("\n"));
  }catch(e){ alert(e.message); }
}

loadReports();
</script>
</body>
</html>
