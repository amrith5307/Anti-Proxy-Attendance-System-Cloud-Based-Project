<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student - Anti-Proxy Attendance</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 1rem;
    }

    h2 {
      color: #38bdf8;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
    }

    button {
      padding: 0.7rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #38bdf8;
      color: #0f172a;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    #video-wrap {
      width: 100%;
      max-width: 480px;
      margin: 1rem auto;
    }

    video {
      display: block;
      width: 100%;
      min-height: 180px;
      background: #020617;
      border-radius: 8px;
      object-fit: contain;
    }

    canvas {
      display: none;
    }

    #scan-msg {
      margin-top: 0.8rem;
      text-align: center;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    #debug-msg {
      margin-top: 0.5rem;
      padding: 0.7rem;
      border-radius: 8px;
      background: #0f172a;
      color: #fbbf24;
      font-size: 0.85rem;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-bottom: 1.5rem;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      text-align: left;
      padding: 0.6rem;
      border-bottom: 1px solid #334155;
    }

    th {
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <header>
    <h2>Student Dashboard</h2>
    <div>
      <span id="user-name"
        style="color:#94a3b8;margin-right:0.5rem"></span>
      <button class="btn-danger" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="card">
    <h3 style="color:#7dd3fc">Scan QR Code</h3>

    <div id="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <div id="scan-msg" role="status" aria-live="polite">
      Ready. Tap Start Camera.
    </div>

    <div id="debug-msg">
      Diagnostic: waiting for camera.
    </div>

    <div style="text-align:center;margin-top:0.5rem">
      <button id="start-btn" class="btn-primary"
        onclick="startCamera()">Start Camera</button>

      <button class="btn-danger"
        onclick="stopCamera()">Stop</button>
    </div>
  </div>

  <div class="card">
    <h3 style="color:#7dd3fc">My Attendance</h3>

    <button class="btn-primary" onclick="loadHistory()">
      Refresh Attendance
    </button>

    <div class="table-wrap" style="margin-top:0.8rem">
      <table>
        <thead>
          <tr>
            <th>Subject</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="att-body">
          <tr>
            <td colspan="2">Loading attendance...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API =
      "https://xrn90564rk.execute-api.ap-south-1.amazonaws.com/prod";

    const idToken = () => sessionStorage.getItem("id_token");

    document.getElementById("user-name").textContent =
      sessionStorage.getItem("user_name") || "Student";

    let stream = null;
    let scanning = false;
    let scanDone = false;
    let animationId = null;
    let lastScanTime = 0;
    let lastDebugMessage = 0;
    let framesProcessed = 0;
    let barcodeDetector = null;
    let scanGeneration = 0;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    const context = canvas.getContext("2d", {
      willReadFrequently: true
    });

    function scanMsg(message, color = "#94a3b8") {
      const element = document.getElementById("scan-msg");
      element.textContent = message;
      element.style.color = color;
    }

    function debugMsg(message) {
      document.getElementById("debug-msg").textContent =
        "Diagnostic: " + message;
    }

    function logout() {
      stopCamera(false);
      sessionStorage.clear();
      location.href = "index.html";
    }

    function stopCamera(showMessage = true) {
      scanning = false;
      scanGeneration++;

      if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      document.getElementById("start-btn").disabled = false;

      if (showMessage) {
        scanMsg("Camera stopped.");
        debugMsg("Camera stopped.");
      }
    }

    async function startCamera() {
      if (scanning) {
        scanMsg("Camera is already running.");
        return;
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        scanMsg(
          "Camera API unavailable. Open the HTTPS website.",
          "#f87171"
        );
        return;
      }

      if (!idToken()) {
        scanMsg("Login session missing. Log in again.", "#f87171");
        return;
      }

      barcodeDetector = null;

      try {
        if ("BarcodeDetector" in window) {
          barcodeDetector = new BarcodeDetector({
            formats: ["qr_code"]
          });
        }
      } catch (error) {
        console.warn("Native detector unavailable:", error);
      }

      if (!barcodeDetector && typeof jsQR !== "function") {
        scanMsg(
          "QR scanner library failed to load. Check internet and reload.",
          "#f87171"
        );
        debugMsg("jsQR and native detector are unavailable.");
        return;
      }

      document.getElementById("start-btn").disabled = true;

      scanMsg("Requesting camera permission...");
      debugMsg("Opening camera...");

      try {
        stopCamera(false);
        const thisScan = scanGeneration;

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        if (thisScan !== scanGeneration) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
          return;
        }

        video.srcObject = stream;

        await new Promise((resolve, reject) => {
          if (video.readyState >= 2 && video.videoWidth > 0) {
            resolve();
            return;
          }

          const onReady = () => {
            cleanup();
            resolve();
          };

          const onError = () => {
            cleanup();
            reject(new Error("Video could not start."));
          };

          const cleanup = () => {
            video.removeEventListener("loadeddata", onReady);
            video.removeEventListener("error", onError);
          };

          video.addEventListener("loadeddata", onReady, {
            once: true
          });

          video.addEventListener("error", onError, {
            once: true
          });
        });

        await video.play();

        if (thisScan !== scanGeneration) {
          return;
        }

        scanning = true;
        scanDone = false;
        framesProcessed = 0;
        lastScanTime = 0;
        lastDebugMessage = 0;

        document.getElementById("start-btn").disabled = false;

        scanMsg(
          "Camera ready. Point at the QR code and hold steady.",
          "#38bdf8"
        );

        debugMsg(
          "Video: " + video.videoWidth + "x" + video.videoHeight +
          " | jsQR: " + (typeof jsQR === "function" ? "loaded" : "missing") +
          " | Native: " + (barcodeDetector ? "available" : "unavailable")
        );

        animationId = requestAnimationFrame(
          timestamp => tick(timestamp, thisScan)
        );

      } catch (error) {
        stopCamera(false);

        let message = error.message || "Unknown error";

        if (error.name === "NotAllowedError") {
          message = "Camera permission denied. Allow camera access.";
        } else if (error.name === "NotFoundError") {
          message = "No camera found.";
        } else if (error.name === "NotReadableError") {
          message = "Camera is busy. Close other camera apps.";
        }

        scanMsg("Camera error: " + message, "#f87171");
        debugMsg(error.name || "Camera startup failed");
        document.getElementById("start-btn").disabled = false;
      }
    }

    async function tick(timestamp, thisScan) {
      if (!scanning || thisScan !== scanGeneration) {
        return;
      }

      try {
        if (
          video.readyState >= 2 &&
          video.videoWidth > 0 &&
          timestamp - lastScanTime >= 100
        ) {
          lastScanTime = timestamp;

          // Increased resolution cap for better module clarity in jsQR
          const scale = Math.min(1, 1280 / video.videoWidth);

          canvas.width = Math.round(video.videoWidth * scale);
          canvas.height = Math.round(video.videoHeight * scale);

          context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );

          framesProcessed++;

          let decodedText = null;

          if (typeof jsQR === "function") {
            const image = context.getImageData(
              0,
              0,
              canvas.width,
              canvas.height
            );

            const result = jsQR(
              image.data,
              image.width,
              image.height,
              {
                inversionAttempts: "attemptBoth"
              }
            );

            if (result && result.data) {
              decodedText = result.data;
            }
          }

          if (
            !decodedText &&
            barcodeDetector &&
            timestamp - lastDebugMessage >= 500
          ) {
            try {
              const results = await Promise.race([
                barcodeDetector.detect(canvas),
                new Promise(resolve =>
                  setTimeout(() => resolve([]), 500)
                )
              ]);

              if (
                scanning &&
                thisScan === scanGeneration &&
                results.length > 0 &&
                results[0].rawValue
              ) {
                decodedText = results[0].rawValue;
              }
            } catch (error) {
              console.warn("Native QR detection failed:", error);
            }
          }

          if (!scanning || thisScan !== scanGeneration) {
            return;
          }

          if (decodedText && !scanDone) {
            scanDone = true;
            scanning = false;

            if (animationId !== null) {
              cancelAnimationFrame(animationId);
              animationId = null;
            }

            if (stream) {
              stream.getTracks().forEach(track => track.stop());
              stream = null;
            }

            video.srcObject = null;

            debugMsg("QR decoded successfully. Sending to AWS...");
            scanMsg(
              "QR detected! Processing attendance...",
              "#f59e0b"
            );

            await handleQRData(decodedText);
            return;
          }

          if (timestamp - lastDebugMessage >= 2000) {
            lastDebugMessage = timestamp;

            scanMsg(
              "Camera running. Keep the QR centered and steady.",
              "#38bdf8"
            );

            debugMsg(
              "Frames: " + framesProcessed +
              " | Image: " + canvas.width + "x" + canvas.height +
              " | jsQR: " + (typeof jsQR === "function" ? "loaded" : "missing") +
              " | QR not detected"
            );
          }
        }
      } catch (error) {
        console.error("Scanner error:", error);
        scanMsg("Scanner error: " + error.message, "#f87171");
        debugMsg("Frame processing failed: " + error.message);
      }

      if (scanning && thisScan === scanGeneration) {
        animationId = requestAnimationFrame(
          nextTimestamp => tick(nextTimestamp, thisScan)
        );
      }
    }

    async function handleQRData(raw) {
      try {
        let payload;

        try {
          payload = JSON.parse(raw);
        } catch {
          throw new Error(
            "QR decoded, but its content is not JSON."
          );
        }

        if (!payload || !payload.token || !payload.session_id) {
          throw new Error(
            "QR decoded, but required fields (token/session_id) are missing."
          );
        }

        scanMsg(
          "QR decoded. Sending attendance request to AWS...",
          "#f59e0b"
        );

        const response = await fetch(API + "/attendance", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": idToken()
          },
          body: JSON.stringify({
            token: payload.token,
            session_id: payload.session_id
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error(
            "AWS returned HTTP " + response.status +
            " with an unreadable response."
          );
        }

        if (!response.ok) {
          throw new Error(
            (data.error || data.message ||
              "Attendance request failed") +
            " (HTTP " + response.status + ")"
          );
        }

        scanMsg(
          (data.message || "Attendance marked") +
          (data.subject ? " — " + data.subject : ""),
          "#4ade80"
        );

        debugMsg("AWS accepted the attendance request.");

        await loadHistory();

      } catch (error) {
        console.error("Attendance error:", error);
        scanMsg("Error: " + error.message, "#f87171");
        debugMsg("QR was decoded, but processing failed.");
      }
    }

    async function loadHistory() {
      const body = document.getElementById("att-body");

      try {
        if (!idToken()) {
          body.innerHTML =
            "<tr><td colspan='2'>Please log in again.</td></tr>";
          return;
        }

        const response = await fetch(API + "/reports", {
          headers: {
            "Authorization": idToken()
          }
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "HTTP " + response.status
          );
        }

        const rows = data.attendance || [];

        body.replaceChildren();

        if (rows.length === 0) {
          body.innerHTML =
            "<tr><td colspan='2' style='color:#94a3b8'>" +
            "No attendance records yet.</td></tr>";
          return;
        }

        rows.forEach(record => {
          const row = document.createElement("tr");
          const subject = document.createElement("td");
          const time = document.createElement("td");

          subject.textContent = record.subject || "—";

          const timestamp = Number(record.marked_at);

          time.textContent = Number.isFinite(timestamp)
            ? new Date(timestamp * 1000).toLocaleString()
            : "—";

          row.append(subject, time);
          body.appendChild(row);
        });

      } catch (error) {
        console.error("History error:", error);

        body.innerHTML =
          "<tr><td colspan='2'>Could not load attendance. " +
          "Check connection or log in again.</td></tr>";
      }
    }

    loadHistory();
  </script>
</body>
</html>
