<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anti-Proxy Attendance – Login</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;
       display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#1e293b;border-radius:12px;padding:2rem;width:360px;
        box-shadow:0 20px 60px #0006}
  h1{font-size:1.4rem;margin-bottom:.3rem;color:#38bdf8}
  p{font-size:.85rem;color:#94a3b8;margin-bottom:1.5rem}
  label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:.3rem}
  input{width:100%;padding:.6rem .8rem;border-radius:8px;border:1px solid #334155;
        background:#0f172a;color:#e2e8f0;margin-bottom:1rem;font-size:.95rem}
  button{width:100%;padding:.75rem;border:none;border-radius:8px;background:#38bdf8;
         color:#0f172a;font-weight:700;font-size:1rem;cursor:pointer}
  button:hover{background:#7dd3fc}
  #msg{margin-top:1rem;font-size:.85rem;color:#f87171;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>🎓 Anti-Proxy Attendance</h1>
  <p>Sign in with your college email</p>
  <label>Email</label>
  <input type="email" id="email" placeholder="you@college.edu">
  <label>Password</label>
  <input type="password" id="pass" placeholder="••••••••">
  <button onclick="login()">Sign In</button>
  <div id="msg"></div>
</div>
<script>
const CONFIG = {
  region:       "ap-south-1",
  userPoolId:   "ap-south-1_KRANtgC8F",
  clientId:     "7g9hqepcfahi0sh619bmdl6v15"
};

function msg(t, err=false){
  document.getElementById("msg").style.color = err?"#f87171":"#4ade80";
  document.getElementById("msg").textContent = t;
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const pass  = document.getElementById("pass").value;
  if(!email||!pass){msg("Fill in both fields",true);return;}
  msg("Signing in…");

  try{
    const res = await fetch(
      `https://cognito-idp.${CONFIG.region}.amazonaws.com/`,
      { method:"POST",
        headers:{
          "Content-Type":"application/x-amz-json-1.1",
          "X-Amz-Target":"AWSCognitoIdentityProviderService.InitiateAuth"
        },
        body: JSON.stringify({
          AuthFlow:"USER_PASSWORD_AUTH",
          ClientId: CONFIG.clientId,
          AuthParameters:{ USERNAME:email, PASSWORD:pass }
        })
      }
    );
    const data = await res.json();
    if(!res.ok) throw new Error(data.message||"Auth failed");

    const { IdToken, AccessToken, RefreshToken } = data.AuthenticationResult;
    sessionStorage.setItem("id_token",    IdToken);
    sessionStorage.setItem("access_token",AccessToken);
    sessionStorage.setItem("refresh_token",RefreshToken);

    const payload = JSON.parse(atob(IdToken.split(".")[1]));
    const groups  = payload["cognito:groups"] || [];
    sessionStorage.setItem("user_name", payload.name||payload.email);
    sessionStorage.setItem("groups", JSON.stringify(groups));

    if(groups.includes("Faculty"))  location.href = "faculty.html";
    else                            location.href = "student.html";

  }catch(e){ msg(e.message, true); }
}
</script>
</body>
</html>
